stages:
    - build
    - deploy

variables:
    GIT_STRATEGY: fetch

build_job:
    stage: build
    script:
        - $VERSION=$(cat version)
        - echo "Building release $VERSION"
        - mkdir -p build/
        - mkdir -p build/img/
        - mkdir -p build/aud/
        - ./compile.bat
        - cp -Recurse -Force ./img/* ./build/img/
        - cp -Recurse -Force ./aud/* ./build/aud/
        - Compress-Archive "./Degrees of Lewdity VERSION.html" "./DoLX_HTML_$VERSION.zip"
        - Compress-Archive ./build/* "./DoLX_Media_$VERSION.zip"
        - echo "Finished Building Release $VERSION"
        - echo "Uploading Release $VERSION"
        - 'Invoke-RestMethod -Headers @{ "JOB-TOKEN"="$CI_JOB_TOKEN" }  -InFile "./DoLX_HTML_$VERSION.zip" -Uri "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_HTML_$VERSION.zip" -Method PUT'
        - 'Invoke-RestMethod -Headers @{ "JOB-TOKEN"="$CI_JOB_TOKEN" }  -InFile "./DoLX_Media_$VERSION.zip" -Uri "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_Media_$VERSION.zip" -Method PUT'
        - rm -Recurse -Force ./build
        - rm -Recurse -Force "./DoLX_HTML_$VERSION.zip"
        - rm -Recurse -Force "./DoLX_Media_$VERSION.zip"
        - echo "Finished Uploading Release $VERSION"
    only:
        - master

release_job:
    stage: deploy
    needs:
        - job: build_job
    rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    script:
        - $VERSION=$(cat version)
        # - $CHANGELOG=$(cat DoLX_Changelog)
        - echo "Creating release ${VERSION}..."
        - $html = "{`"name`":`"DoLX_HTML_$VERSION`", `"url`":`"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_HTML_$VERSION.zip`"}"
        - $htmlJSON = $html | ConvertTo-Json
        - $media = "{`"name`":`"DoLX_Media_$VERSION`", `"url`":`"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_Media_$VERSION.zip`"}"
        - $mediaJSON = $media | ConvertTo-Json
        - release-cli create --name "DoL:X-Change Edition $VERSION" --description ./DoLX_Changelog.md --ref $CI_COMMIT_SHA --tag-name $VERSION --assets-link=$htmlJSON --assets-link=$mediaJSON

        # - $payload=@{ "name"="DoL:X-Change Edition $VERSION"; "tag_name"="$VERSION"; "ref"=$CI_COMMIT_SHA; "assets"=@{"links"=@(@{"name"="DoLX_HTML_$VERSION"; "url"="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_HTML_$VERSION/$VERSION/DoLX_HTML_$VERSION.zip"}, @{"name"="DoLX_Media_$VERSION"; "url"="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_Media_$VERSION/$VERSION/DoLX_Media_$VERSION.zip"})} }
        # - $payloadJSON=$payload | ConvertTo-Json -Depth 3
        # - Invoke-RestMethod -Method Post -ContentType "application/json" -Headers @{ "JOB-TOKEN"="$CI_JOB_TOKEN" } -Uri "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" -Body $payloadJSON 
    after_script:
        - echo "Finished creating release."
