stages:
  - build
  - deploy

variables:
  GIT_STRATEGY: fetch
  # Set DOLX_UPLOAD_AUDIO to "true" only when the audio files actually change!
  DOLX_AUDIO_PACKAGE_VERSION: "0.19.0"
  DOLX_UPLOAD_AUDIO: "false"

audio_job:
  stage: build
  script:
    - |
      $ErrorActionPreference = "Stop"
      $FULLVERSION = Get-Content -Raw ./version
      $AUDIO_VERSION = "$env:DOLX_AUDIO_PACKAGE_VERSION"

      if ([string]::IsNullOrWhiteSpace($AUDIO_VERSION)) {
        throw "DOLX_AUDIO_PACKAGE_VERSION is empty. Set it to the latest uploaded audio package version."
      }

      if ($env:DOLX_UPLOAD_AUDIO -ne "true") {
        Write-Host "Audio upload skipped."
        Write-Host "Game version: $FULLVERSION"
        Write-Host "Release will reuse existing audio package version $AUDIO_VERSION."
      }
      else {
        Write-Host "Building Audio Release $AUDIO_VERSION"

        $buildDir = "./build_audio"
        $zipPath = "./DoLX_Audio_$AUDIO_VERSION.zip"

        Remove-Item -Recurse -Force $buildDir -ErrorAction SilentlyContinue
        Remove-Item -Force $zipPath -ErrorAction SilentlyContinue

        New-Item -ItemType Directory -Force "$buildDir/audio" | Out-Null
        Copy-Item -Path ./audio/* -Destination "$buildDir/audio/" -Recurse -Force

        $audioFiles = Get-ChildItem "$buildDir/audio" -File -Recurse
        $rawAudioSize = ($audioFiles | Measure-Object Length -Sum).Sum
        if ($null -eq $rawAudioSize) { $rawAudioSize = 0 }
        Write-Host ("Raw audio size: {0:N2} MB" -f ($rawAudioSize / 1MB))

        tar.exe -a -cf $zipPath -C $buildDir audio
        if ($LASTEXITCODE -ne 0) { throw "Audio archive creation failed." }

        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath).Path)
        try {
          $invalidEntries = @($archive.Entries | Where-Object { $_.FullName -match '\\' } | ForEach-Object FullName)
        }
        finally {
          $archive.Dispose()
        }
        if ($invalidEntries) {
          throw "Audio archive contains Windows-style paths: $($invalidEntries -join ', ')"
        }

        $zipSize = (Get-Item $zipPath).Length
        Write-Host ("Audio zip size: {0:N2} MB" -f ($zipSize / 1MB))

        Write-Host "Finished Building Audio Release $AUDIO_VERSION"
        Write-Host "Uploading Audio Release $AUDIO_VERSION"

        $uploadUrl = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/DoLX_Audio/$AUDIO_VERSION/DoLX_Audio_$AUDIO_VERSION.zip"

        curl.exe --fail --show-error --silent `
          --header "JOB-TOKEN: $env:CI_JOB_TOKEN" `
          --header "Content-Type: application/zip" `
          --retry 5 `
          --retry-delay 5 `
          --upload-file $zipPath `
          "$uploadUrl"

        if ($LASTEXITCODE -ne 0) { throw "Audio upload failed." }

        Remove-Item -Recurse -Force $buildDir -ErrorAction SilentlyContinue
        Remove-Item -Force $zipPath -ErrorAction SilentlyContinue

        Write-Host "Finished Uploading Audio Release $AUDIO_VERSION"
      }
  only:
    - master
img_job:
  stage: build
  script:
    - |
      $ErrorActionPreference = "Stop"
      $FULLVERSION = Get-Content -Raw ./version

      if ($FULLVERSION -match "DoLX (\d+\.\d+\.\d+)(?![a-z]+)") {
        $VERSION = $matches[1]
        Write-Host "Building Images Release $VERSION"

        $buildDir = "./build_img"
        $zipPath = "./DoLX_Images_$VERSION.zip"

        Remove-Item -Recurse -Force $buildDir -ErrorAction SilentlyContinue
        Remove-Item -Force $zipPath -ErrorAction SilentlyContinue

        New-Item -ItemType Directory -Force "$buildDir/img" | Out-Null
        New-Item -ItemType Directory -Force "$buildDir/img2" | Out-Null
        Copy-Item -Path ./img/* -Destination "$buildDir/img/" -Recurse -Force
        Copy-Item -Path ./img2/* -Destination "$buildDir/img2/" -Recurse -Force

        $imageFiles = Get-ChildItem $buildDir -File -Recurse
        $rawImageSize = ($imageFiles | Measure-Object Length -Sum).Sum
        if ($null -eq $rawImageSize) { $rawImageSize = 0 }
        Write-Host ("Raw images size: {0:N2} MB" -f ($rawImageSize / 1MB))

        tar.exe -a -cf $zipPath -C $buildDir img img2
        if ($LASTEXITCODE -ne 0) { throw "Images archive creation failed." }

        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath).Path)
        try {
          $invalidEntries = @($archive.Entries | Where-Object { $_.FullName -match '\\' } | ForEach-Object FullName)
        }
        finally {
          $archive.Dispose()
        }
        if ($invalidEntries) {
          throw "Images archive contains Windows-style paths: $($invalidEntries -join ', ')"
        }

        $zipSize = (Get-Item $zipPath).Length
        Write-Host ("Images zip size: {0:N2} MB" -f ($zipSize / 1MB))

        Write-Host "Finished Building Images Release $VERSION"
        Write-Host "Uploading Images Release $VERSION"

        $uploadUrl = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/DoLX_Images/$VERSION/DoLX_Images_$VERSION.zip"

        curl.exe --fail --show-error --silent `
          --header "JOB-TOKEN: $env:CI_JOB_TOKEN" `
          --header "Content-Type: application/zip" `
          --retry 5 `
          --retry-delay 5 `
          --upload-file $zipPath `
          "$uploadUrl"

        if ($LASTEXITCODE -ne 0) { throw "Images upload failed." }

        Remove-Item -Recurse -Force $buildDir -ErrorAction SilentlyContinue
        Remove-Item -Force $zipPath -ErrorAction SilentlyContinue

        Write-Host "Finished Uploading Images Release $VERSION"
      }
      else {
        Write-Host "Images package skipped (version has suffix): $FULLVERSION"
      }
  only:
    - master

html_job:
  stage: build
  variables:
    # Avoid reusing a damaged shallow checkout from an earlier job on the shell runner.
    GIT_STRATEGY: clone
  script:
    - |
      $ErrorActionPreference = "Stop"
      $FULLVERSION = Get-Content -Raw ./version

      if ($FULLVERSION -match "DoLX (\d+\.\d+\.\d+[a-z]*)") {
        $VERSION = $matches[1]
      }
      else {
        throw "Could not parse HTML version from version file: $FULLVERSION"
      }

      Write-Host "Building HTML Release $VERSION"

      $zipPath = "./DoLX_HTML_$VERSION.zip"
      Remove-Item -Force $zipPath -ErrorAction SilentlyContinue

      ./compile.bat
      Compress-Archive -Path "./Degrees of Lewdity VERSION.html" -DestinationPath $zipPath -Force

      $zipSize = (Get-Item $zipPath).Length
      Write-Host ("HTML zip size: {0:N2} MB" -f ($zipSize / 1MB))

      Write-Host "Finished Building HTML Release $VERSION"
      Write-Host "Uploading HTML Release $VERSION"

      $uploadUrl = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/DoLX_HTML/$VERSION/DoLX_HTML_$VERSION.zip"

      curl.exe --fail --show-error --silent `
        --header "JOB-TOKEN: $env:CI_JOB_TOKEN" `
        --header "Content-Type: application/zip" `
        --retry 5 `
        --retry-delay 5 `
        --upload-file $zipPath `
        "$uploadUrl"

      if ($LASTEXITCODE -ne 0) { throw "HTML upload failed." }

      Remove-Item -Force $zipPath -ErrorAction SilentlyContinue
      Write-Host "Finished Uploading HTML Release $VERSION"
  only:
    - master

release_job:
  stage: deploy
  needs:
    - job: audio_job
    - job: img_job
    - job: html_job
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      $ErrorActionPreference = "Stop"
      $FULLVERSION = Get-Content -Raw ./version

      if ($FULLVERSION -match "DoLX (((\d+\.\d+\.)\d+)[a-z]*)") {
        $VERSION = $matches[1]
        $MINOR   = $matches[2]
      }
      else {
        throw "Could not parse release version from version file: $FULLVERSION"
      }

      $AUDIO_VERSION = "$env:DOLX_AUDIO_PACKAGE_VERSION"
      if ([string]::IsNullOrWhiteSpace($AUDIO_VERSION)) {
        throw "DOLX_AUDIO_PACKAGE_VERSION is empty. Set it to the latest uploaded audio package version."
      }

      Write-Host "Creating release $VERSION..."
      Write-Host "Release will link audio package $AUDIO_VERSION."

      function Test-PackageLink {
        param(
          [Parameter(Mandatory=$true)][string]$Name,
          [Parameter(Mandatory=$true)][string]$Url
        )

        Write-Host "Checking $Name package link: $Url"
        curl.exe --fail --show-error --silent --location --head `
          --header "JOB-TOKEN: $env:CI_JOB_TOKEN" `
          "$Url" | Out-Null

        if ($LASTEXITCODE -ne 0) {
          throw "$Name package link is missing or inaccessible: $Url"
        }
      }

      $htmlObj = @{
        name = "DownloadMe_DoLX_HTML_$VERSION"
        url  = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/DoLX_HTML/$VERSION/DoLX_HTML_$VERSION.zip"
      }
      $htmlJSON = ($htmlObj | ConvertTo-Json -Compress) -replace '"', '\"'

      $imageObj = @{
        name = "DownloadMe_DoLX_Images_$MINOR"
        url  = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/DoLX_Images/$MINOR/DoLX_Images_$MINOR.zip"
      }
      $imageJSON = ($imageObj | ConvertTo-Json -Compress) -replace '"', '\"'

      $audioObj = @{
        name = "DownloadMe_DoLX_Audio_$AUDIO_VERSION"
        url  = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/DoLX_Audio/$AUDIO_VERSION/DoLX_Audio_$AUDIO_VERSION.zip"
      }
      $audioJSON = ($audioObj | ConvertTo-Json -Compress) -replace '"', '\"'

      Test-PackageLink "HTML" $htmlObj.url
      Test-PackageLink "Images" $imageObj.url
      Test-PackageLink "Audio" $audioObj.url

      $releaseArgs = @(
        "create",
        "--name", "DoL:X-Change Edition $VERSION",
        "--description", "DoLX_Changelog.md",
        "--ref", "$env:CI_COMMIT_SHA",
        "--tag-name", "$VERSION",
        "--assets-link", "$htmlJSON",
        "--assets-link", "$imageJSON",
        "--assets-link", "$audioJSON"
      )

      & "C:\GitLab-Runner\release-cli.exe" @releaseArgs

      if ($LASTEXITCODE -ne 0) {
        throw "release-cli failed."
      }
  after_script:
    - echo "Finished creating release."
