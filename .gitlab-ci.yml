stages:
    - build
    - release

variables:
    GIT_STRATEGY: fetch
    VERSION:

build_job:
    stage: build
    script:
        - $VERSION=$(cat version)
        - echo "Building release $VERSION"
        # - find ./version -type f -exec sed -i "s/DoLX version/DoLX v0.8.$CI_PIPELINE_IID/g" {} +
        # - find ./devTools/androidsdk/image/cordova/config.xml -type f -exec sed -i "s/DoLX version/DoLX v0.8.$CI_PIPELINE_IID/g" {} +
        # - find ./devTools/apkbuilder/config.xml -type f -exec sed -i "s/DoLX version/DoLX v0.8.$CI_PIPELINE_IID/g" {} +
        # - find ./game/01-config/sugarcubeConfig.js -type f -exec sed -i "s/DoLX version/DoLX v0.8.$CI_PIPELINE_IID/g" {} +
        - mkdir -p build/
        - mkdir -p build/img/
        - mkdir -p build/aud/
        - ./compile.bat
        - cp "Degrees of Lewdity VERSION.html" ./build/
        - cp -Recurse -Force ./img/* ./build/img/
        - cp -Recurse -Force ./aud/* ./build/aud/
        - Compress-Archive ./build/* "./DoLX_$VERSION.zip"
        - echo "Finished Building Release $VERSION"
        - echo "Uploading Release $VERSION"
        - 'Invoke-RestMethod -Headers @{ "JOB-TOKEN"="$CI_JOB_TOKEN" }  -InFile "./DoLX_$VERSION.zip" -Uri "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_$VERSION.zip" -Method PUT'
        - rm -Recurse -Force ./build
        - rm -Recurse -Force "./DoLX_$VERSION.zip"
        - echo "Finished Uploading Release $VERSION"
    only:
        - master

release_job:
    stage: release
    image: registry.gitlab.com/gitlab-org/release-cli:latest
    needs:
        - job: build_job
    rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    script:
        - echo "Creating release..."
        # - '$data=''{
        #         "name":"DoL ~ X-Change Edition $VERSION", 
        #         "tag_name":$VERSION, 
        #         "assets":{ 
        #             "links":[{ 
        #                 "name":"DoLX_$VERSION", 
        #                 "url":"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_$VERSION.zip"
        #             }]
        #         }
        #     }'' '
        # - curl -Headers @{ "JOB-TOKEN"=$CI_JOB_TOKEN; "Content-Type"="application/json" } -Method POST -Body $data -Uri "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
    release:
        name: "DoL ~ X-Change Edition $VERSION"
        description: "Changelog:"
        tag_name: '$VERSION'
        ref: '$CI_COMMIT_SHA'
        assets:
            links:
                - name: 'DoLX ~ $VERSION'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_$VERSION.zip"
    after_script:
        - echo "Finished creating release."
