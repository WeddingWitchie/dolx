stages:
    - compilation
    - upload

variables:
    GIT_STRATEGY: fetch
    VERSION:

build_upload_job:
    stage: compilation
    script:
        - $VERSION=$(cat version)
        - echo "Building release $VERSION"
        # - find ./version -type f -exec sed -i "s/DoLX version/DoLX v0.8.$CI_PIPELINE_IID/g" {} +
        # - find ./devTools/androidsdk/image/cordova/config.xml -type f -exec sed -i "s/DoLX version/DoLX v0.8.$CI_PIPELINE_IID/g" {} +
        # - find ./devTools/apkbuilder/config.xml -type f -exec sed -i "s/DoLX version/DoLX v0.8.$CI_PIPELINE_IID/g" {} +
        # - find ./game/01-config/sugarcubeConfig.js -type f -exec sed -i "s/DoLX version/DoLX v0.8.$CI_PIPELINE_IID/g" {} +
        - mkdir -p build/
        - mkdir -p build/img/
        - mkdir -p build/aud/
        - ./compile.bat
        - cp "Degrees of Lewdity VERSION.html" ./build/
        - cp -Recurse -Force ./img/* ./build/img/
        - cp -Recurse -Force ./aud/* ./build/aud/
        - Compress-Archive ./build/* "./DoLX - $VERSION.zip"
        - echo "Finished Building Release $VERSION"
        - echo "Uploading Release $VERSION"
        - $releaseFile=$(Get-Content -Raw -Path "./DoLX - $VERSION.zip")
        # - $RequestParams:
        #     Header: {JOB-TOKEN: $CI_JOB_TOKEN}
        #     Method: "POST"
        #     InFile: $releaseFile
        #     Uri: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/release/${VERSION}/DoLX - ${VERSION}.zip"
        # - curl @RequestParams
        - 'curl 
            -Method POST 
            -Uri "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/release/${VERSION}/DoLX - ${VERSION}.zip" 
            -Headers @{JOB-TOKEN=$CI_JOB_TOKEN} 
            -InFile $releaseFile'
        # - 'curl
        #     --header "JOB-TOKEN: $CI_JOB_TOKEN"
        #     --upload-file "./DoLX - $VERSION.zip"
        #     "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/release/${VERSION}/DoLX - ${VERSION}.zip"'
        - rem -rf ./build
        - rem -rf "./DoLX - $VERSION.zip"
        - echo "Finished Uploading Release $VERSION"
    only:
        - master

release_job:
    stage: upload
    image: registry.gitlab.com/gitlab-org/release-cli:latest
    needs:
        - job: build_upload_job
    rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    script:
        - echo "Creating releases..."
    release:
        description: 'Click on one of the links under OTHER with the image pack you want to use, extract the downloaded zip and play.

            Changelogs:'
        tag_name: '$VERSION'
        ref: '$CI_COMMIT_SHA'
        assets:
            links:
                - name: 'DoLX'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/release/$VERSION/DoLX - $VERSION.zip"
    after_script:
        - echo "Finished creating releases."
