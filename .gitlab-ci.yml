stages:
    - build
    - deploy

variables:
    GIT_STRATEGY: fetch

build_vanilla_apk_job:
    stage: build
    script:
        - $VERSION=$(cat version)
        - echo "Building vanilla APK release $VERSION"
        - cp -Recurse -Force "./imagepacks/vanilla/*" -Destination "./img"
        - ./compile.bat
        - cd devTools/apkbuilder
        - ./setup_deps.bat
        - ./build_app_debug.bat
        - cd ../..
        - echo "Finished Building Vanilla APK Release $VERSION"
        - echo "Uploading Vanilla APK $VERSION"
        - 'Invoke-RestMethod -Headers @{ "JOB-TOKEN"="$CI_JOB_TOKEN" }  -InFile "./dist/Degrees-of-Lewdity-X-Change-$VERSION-debug.apk" -Uri "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/Degrees-of-Lewdity-X-Change-$VERSION-vanilla.apk" -Method PUT'
        - rm -Recurse -Force "./dist/Degrees-of-Lewdity-X-Change-$VERSION-debug.apk"
        - echo "Finished Uploading Vanilla APK $VERSION"
    only:
        - master

build_mysterious_apk_job:
    stage: build
    script:
        - $VERSION=$(cat version)
        - echo "Building mysterious APK release $VERSION"
        - cp -Recurse -Force "./imagepacks/vanilla/*" -Destination "./img"
        - cp -Recurse -Force "./imagepacks/mysterious/*" -Destination "./img"
        - ./compile.bat
        - cd devTools/apkbuilder
        - ./setup_deps.bat
        - ./build_app_debug.bat
        - cd ../..
        - echo "Finished Building Mysterious APK Release $VERSION"
        - echo "Uploading Mysterious APK $VERSION"
        - 'Invoke-RestMethod -Headers @{ "JOB-TOKEN"="$CI_JOB_TOKEN" }  -InFile "./dist/Degrees-of-Lewdity-X-Change-$VERSION-debug.apk" -Uri "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/Degrees-of-Lewdity-X-Change-$VERSION-mysterious.apk" -Method PUT'
        - rm -Recurse -Force "./dist/Degrees-of-Lewdity-X-Change-$VERSION-debug.apk"
        - echo "Finished Uploading Mysterious APK $VERSION"
    only:
        - master

build_job:
    stage: build
    script:
        - $VERSION=$(cat version)
        - echo "Building release $VERSION"
        - mkdir -p build/
        - mkdir -p build/img/
        - mkdir -p build/audio/
        - ./compile.bat
        - cp -Recurse -Force ./imagepacks/vanilla/* ./build/img/
        - cp -Recurse -Force ./audio/* ./build/audio/
        - Compress-Archive "./Degrees of Lewdity VERSION.html" "./DoLX_HTML_$VERSION.zip"
        - Compress-Archive ./build/* "./DoLX_Media_$VERSION.zip"
        - echo "Finished Building Release $VERSION"
        - echo "Uploading Release $VERSION"
        - 'Invoke-RestMethod -Headers @{ "JOB-TOKEN"="$CI_JOB_TOKEN" }  -InFile "./DoLX_HTML_$VERSION.zip" -Uri "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_HTML_$VERSION.zip" -Method PUT'
        - 'Invoke-RestMethod -Headers @{ "JOB-TOKEN"="$CI_JOB_TOKEN" }  -InFile "./DoLX_Media_$VERSION.zip" -Uri "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_Media_$VERSION.zip" -Method PUT'
        - rm -Recurse -Force ./build
        - rm -Recurse -Force "./DoLX_HTML_$VERSION.zip"
        - rm -Recurse -Force "./DoLX_Media_$VERSION.zip"
        - echo "Finished Uploading Release $VERSION"
    only:
        - master

release_job:
    stage: deploy
    needs:
        - job: build_job
    rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    script:
        - $VERSION=$(cat version)
        # - $CHANGELOG=$(cat DoLX_Changelog)
        - echo "Creating release ${VERSION}..."
        - $html = "{`"name`":`"DownloadMe_DoLX_HTML_$VERSION`", `"url`":`"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_HTML_$VERSION.zip`"}"
        - $htmlJSON = $html | ConvertTo-Json
        - $media = "{`"name`":`"DownloadMe_DoLX_Media_$VERSION`", `"url`":`"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_Media_$VERSION.zip`"}"
        - $mediaJSON = $media | ConvertTo-Json
        - $vanillaApk = "{`"name`":`"DoLX_Android_Vanilla_$VERSION.apk`", `"url`":`"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/Degrees-of-Lewdity-X-Change-$VERSION-vanilla.apk`"}"
        - $vanillaApkJSON = $vanillaApk | ConvertTo-Json
        - $mysteriousApk = "{`"name`":`"DoLX_Android_Mysterious_$VERSION.apk`", `"url`":`"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/Degrees-of-Lewdity-X-Change-$VERSION-mysterious.apk`"}"
        - $mysteriousApkJSON = $mysteriousApk | ConvertTo-Json
        - release-cli create --name "DoL:X-Change Edition $VERSION" --description ./DoLX_Changelog.md --ref $CI_COMMIT_SHA --tag-name $VERSION --assets-link=$htmlJSON --assets-link=$mediaJSON --assets-link=$vanillaApkJSON --assets-link=$mysteriousApkJSON

    after_script:
        - echo "Finished creating release."
