build_job:
    stage: build
    script:
        - echo $CI_API_V4_URL
        - echo $CI_PROJECT_ID
        - $FULLVERSION=$(cat version)
        - if ($FULLVERSION -match "DoLX (\d+\.\d+\.\d+[a-z]*)") {$VERSION=$matches[1]}
        - echo "Building release $VERSION"
        - mkdir -p buildImg/
        - mkdir -p buildAudio/
        - ./compile.bat
        - cp -Recurse -Force ./imagepacks/vanilla/* ./buildImg/
        - cp -Recurse -Force ./audio/* ./buildAudio/
        - Compress-Archive "./Degrees of Lewdity VERSION.html" "./DoLX_HTML_$VERSION.zip"
        - Compress-Archive ./buildImg/* "./DoLX_Images_$VERSION.zip"
        - Compress-Archive ./buildAudio/* "./DoLX_Audio_$VERSION.zip"
        - echo "Finished Building Release $VERSION"
        - echo "Uploading Release $VERSION"
        - 'Invoke-RestMethod -Headers @{ "JOB-TOKEN"="$CI_JOB_TOKEN" }  -InFile "./DoLX_HTML_$VERSION.zip" -Uri "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_HTML_$VERSION.zip" -Method PUT'
        - 'Invoke-RestMethod -Headers @{ "JOB-TOKEN"="$CI_JOB_TOKEN" }  -InFile "./DoLX_Images_$VERSION.zip" -Uri "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_Images_$VERSION.zip" -Method PUT'
        - 'Invoke-RestMethod -Headers @{ "JOB-TOKEN"="$CI_JOB_TOKEN" }  -InFile "./DoLX_Audio_$VERSION.zip" -Uri "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_Audio_$VERSION.zip" -Method PUT'
        - rm -Recurse -Force ./build
        - rm -Recurse -Force "./DoLX_HTML_$VERSION.zip"
        - rm -Recurse -Force "./DoLX_Images_$VERSION.zip"
        - rm -Recurse -Force "./DoLX_Audio_$VERSION.zip"
        - echo "Finished Uploading Release $VERSION"
    only:
        - master

release_job:
    stage: deploy
    needs:
        - job: build_job
    rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    script:
        - $FULLVERSION=$(cat version)
        - if ($FULLVERSION -match "DoLX (\d+\.\d+\.\d+[a-z]*)") {$VERSION=$matches[1]}
        - echo "Creating release ${VERSION}..."
        - $html = "{`"name`":`"DownloadMe_DoLX_HTML_$VERSION`", `"url`":`"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_HTML_$VERSION.zip`"}"
        - $htmlJSON = $html | ConvertTo-Json
        - $image = "{`"name`":`"DownloadMe_DoLX_Images_$VERSION`", `"url`":`"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_Images_$VERSION.zip`"}"
        - $imageJSON = $image | ConvertTo-Json
        - $audio = "{`"name`":`"DownloadMe_DoLX_Audio_$VERSION`", `"url`":`"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_Audio_$VERSION.zip`"}"
        - $audioJSON = $audio | ConvertTo-Json
        - release-cli create --name "DoL:X-Change Edition $VERSION" --description ./DoLX_Changelog.md --ref $CI_COMMIT_SHA --tag-name $VERSION --assets-link=$htmlJSON --assets-link=$imageJSON  --assets-link=$audioJSON 

    after_script:
        - echo "Finished creating release."
