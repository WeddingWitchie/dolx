stages:
    - build
    - deploy

variables:
    GIT_STRATEGY: fetch

audio_job:
    stage: build
    script:
        - $FULLVERSION=$(cat version)
        - |
          if ($FULLVERSION -match "DoLX (\d+\.\d+\.0)(?![a-z]+)") {
            $VERSION=$matches[1]
            echo "Building Audio Release $VERSION"
            mkdir -p build/
            mkdir -p build/audio/
            cp -Recurse -Force ./audio/* ./build/audio/
            Compress-Archive ./build/* "./DoLX_Audio_$VERSION.zip"
            echo "Finished Building Audio Release $VERSION"
            echo "Uploading Audio Release $VERSION"
            'Invoke-RestMethod -Headers @{ "JOB-TOKEN"="$CI_JOB_TOKEN" }  -InFile "./DoLX_Audio_$VERSION.zip" -Uri "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_Audio_$VERSION.zip" -Method PUT'
            rm -Recurse -Force ./build
            rm -Recurse -Force "./DoLX_Audio_$VERSION.zip"
            echo "Finished Uploading Audio Release $VERSION"
          }
    only:
        - master

img_job:
    stage: build
    script:
        - $FULLVERSION=$(cat version)
        - |
          if ($FULLVERSION -match "DoLX (\d+\.\d+\.\d+)(?![a-z]+)") {
            $VERSION=$matches[1]
            echo "Building Images Release $VERSION"
            mkdir -p build/
            mkdir -p build/img/
            mkdir -p build/img2/
            cp -Recurse -Force ./img/* ./build/img/
            cp -Recurse -Force ./img2/* ./build/img2/
            Compress-Archive ./build/* "./DoLX_Images_$VERSION.zip"
            echo "Finished Building Images Release $VERSION"
            echo "Uploading Images Release $VERSION"
            'Invoke-RestMethod -Headers @{ "JOB-TOKEN"="$CI_JOB_TOKEN" }  -InFile "./DoLX_Images_$VERSION.zip" -Uri "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_Images_$VERSION.zip" -Method PUT'
            rm -Recurse -Force ./build
            rm -Recurse -Force "./DoLX_Images_$VERSION.zip"
            echo "Finished Uploading Images Release $VERSION"
          }
    only:
        - master

html_job:
    stage: build
    script:
        - $FULLVERSION=$(cat version)
        - if ($FULLVERSION -match "DoLX (\d+\.\d+\.\d+[a-z]*)") {$VERSION=$matches[1]}
        - echo "Building HTML Release $VERSION"
        - ./compile.bat
        - Compress-Archive "./Degrees of Lewdity VERSION.html" "./DoLX_HTML_$VERSION.zip"
        - echo "Finished Building HTML Release $VERSION"
        - echo "Uploading HTML Release $VERSION"
        - 'Invoke-RestMethod -Headers @{ "JOB-TOKEN"="$CI_JOB_TOKEN" }  -InFile "./DoLX_HTML_$VERSION.zip" -Uri "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_HTML_$VERSION.zip" -Method PUT'
        - rm -Recurse -Force "./DoLX_HTML_$VERSION.zip"
        - echo "Finished Uploading HTML Release $VERSION"
    only:
        - master

release_job:
    stage: deploy
    needs:
        - job: build_job
    rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    script:
        - $FULLVERSION=$(cat version)
        - |
          if ($FULLVERSION -match "DoLX (((\d+\.\d+\.)\d+)[a-z]*)") {
            $VERSION=$matches[1]
            $MINOR=$matches[2]
            $MAJOR=$matches[3]+"0"
          }
        - echo "Creating release ${VERSION}..."
        - $html = "{`"name`":`"DownloadMe_DoLX_HTML`", `"url`":`"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$VERSION/$VERSION/DoLX_HTML_$VERSION.zip`"}"
        - $htmlJSON = $html | ConvertTo-Json
        - $image = "{`"name`":`"DownloadMe_DoLX_Images`", `"url`":`"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$MINOR/$MINOR/DoLX_Images_$MINOR.zip`"}"
        - $imageJSON = $image | ConvertTo-Json
        - $audio = "{`"name`":`"DownloadMe_DoLX_Audio`", `"url`":`"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_$MAJOR/$MAJOR/DoLX_Audio_$MAJOR.zip`"}"
        - $audioJSON = $audio | ConvertTo-Json
        - release-cli create --name "DoL:X-Change Edition $VERSION" --description ./DoLX_Changelog.md --ref $CI_COMMIT_SHA --tag-name $VERSION --assets-link=$htmlJSON --assets-link=$imageJSON  --assets-link=$audioJSON 

    after_script:
        - echo "Finished creating release."
