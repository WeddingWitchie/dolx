stages:
  - build
  - deploy

variables:
  GIT_STRATEGY: fetch

audio_job:
  stage: build
  script:
    - $FULLVERSION=$(cat version)
    - |
      if ($FULLVERSION -match "DoLX (\d+\.\d+\.0)(?![a-z]+)") {
        $VERSION=$matches[1]
        echo "Building Audio Release $VERSION"
        mkdir -p build/
        mkdir -p build/audio/
        cp -Recurse -Force ./audio/* ./build/audio/
        Compress-Archive ./build/* "./DoLX_Audio_$VERSION.zip"
        echo "Finished Building Audio Release $VERSION"
        echo "Uploading Audio Release $VERSION"
        Invoke-RestMethod -Headers @{ "JOB-TOKEN"="$CI_JOB_TOKEN" }  -InFile "./DoLX_Audio_$VERSION.zip" -Uri "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_Audio/$VERSION/DoLX_Audio_$VERSION.zip" -Method PUT
        rm -Recurse -Force ./build
        rm -Recurse -Force "./DoLX_Audio_$VERSION.zip"
        echo "Finished Uploading Audio Release $VERSION"
      }
  only:
    - master

img_job:
  stage: build
  script:
    - $FULLVERSION=$(cat version)
    - |
      if ($FULLVERSION -match "DoLX (\d+\.\d+\.\d+)(?![a-z]+)") {
        $VERSION=$matches[1]
        echo "Building Images Release $VERSION"
        mkdir -p build/
        mkdir -p build/img/
        mkdir -p build/img2/
        cp -Recurse -Force ./img/* ./build/img/
        cp -Recurse -Force ./img2/* ./build/img2/

        echo "Creating ZIP DoLX_Images_$VERSION.zip (Linux-safe paths)"
        Add-Type -AssemblyName System.IO.Compression.FileSystem

        $zipPath = ".\DoLX_Images_$VERSION.zip"
        if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

        $baseDir = (Resolve-Path ".\build").Path
        $zip = [System.IO.Compression.ZipFile]::Open($zipPath, [System.IO.Compression.ZipArchiveMode]::Create)
        try {
          Get-ChildItem -Path $baseDir -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($baseDir.Length).TrimStart('\','/')
            $entryName = ($rel -replace '\\','/')  # force "/" inside the zip
            [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
              $zip, $_.FullName, $entryName, [System.IO.Compression.CompressionLevel]::Optimal
            ) | Out-Null
          }
        }
        finally {
          $zip.Dispose()
        }

        echo "Finished Building Images Release $VERSION"
        echo "Uploading Images Release $VERSION"

        $ErrorActionPreference = "Stop"
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        [Net.ServicePointManager]::Expect100Continue = $false
        $ProgressPreference = "SilentlyContinue"

        $uri  = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/DoLX_Images/$VERSION/DoLX_Images_$VERSION.zip"
        $file = $zipPath

        Write-Host "Uploading to: $uri"
        Get-Item $file | Format-List Name,Length

        curl.exe --fail --location --retry 5 --retry-delay 2 `
          --connect-timeout 30 --max-time 1800 `
          --header "JOB-TOKEN: $env:CI_JOB_TOKEN" `
          --upload-file "$file" `
          "$uri"

        if ($LASTEXITCODE -ne 0) { throw "Upload failed with exit code $LASTEXITCODE" }

        Remove-Item -Recurse -Force .\build
        Remove-Item -Force $zipPath

        echo "Finished Uploading Images Release $VERSION"
      }
  only:
    - master

html_job:
  stage: build
  script:
    - $FULLVERSION=$(cat version)
    - if ($FULLVERSION -match "DoLX (\d+\.\d+\.\d+[a-z]*)") {$VERSION=$matches[1]}
    - echo "Building HTML Release $VERSION"
    - ./compile.bat
    - Compress-Archive "./Degrees of Lewdity VERSION.html" "./DoLX_HTML_$VERSION.zip"
    - echo "Finished Building HTML Release $VERSION"
    - echo "Uploading HTML Release $VERSION"
    - 'Invoke-RestMethod -Headers @{ "JOB-TOKEN"="$CI_JOB_TOKEN" }  -InFile "./DoLX_HTML_$VERSION.zip" -Uri "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_HTML/$VERSION/DoLX_HTML_$VERSION.zip" -Method PUT'
    - rm -Recurse -Force "./DoLX_HTML_$VERSION.zip"
    - echo "Finished Uploading HTML Release $VERSION"
  only:
    - master

release_job:
  stage: deploy
  needs:
    - job: audio_job
    - job: img_job
    - job: html_job
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - $FULLVERSION=$(cat version)
    - |
      if ($FULLVERSION -match "DoLX (((\d+\.\d+\.)\d+)[a-z]*)") {
        $VERSION=$matches[1]
        $MINOR=$matches[2]
        $MAJOR=$matches[3]+"0"
      }
    - echo "Creating release ${VERSION}..."
    - $html = "{`"name`":`"DownloadMe_DoLX_HTML_$VERSION`", `"url`":`"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_HTML/$VERSION/DoLX_HTML_$VERSION.zip`"}"
    - $htmlJSON = $html | ConvertTo-Json
    - |
      $imageObj = @{
        name = "DownloadMe_DoLX_Images_$VERSION"
        url  = "$env:CI_PROJECT_URL/-/packages/generic/DoLX_Images/$VERSION/DoLX_Images_$VERSION.zip"
      }
      $imageJSON = $imageObj | ConvertTo-Json -Compress
    - $audio = "{`"name`":`"DownloadMe_DoLX_Audio_$MAJOR`", `"url`":`"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLX_Audio/$MAJOR/DoLX_Audio_$MAJOR.zip`"}"
    - $audioJSON = $audio | ConvertTo-Json
    - C:\GitLab-Runner\release-cli.exe create --name "DoL:X-Change Edition $VERSION" --description ./DoLX_Changelog.md --ref $CI_COMMIT_SHA --tag-name $VERSION --assets-link "$htmlJSON" --assets-link "$imageJSON" --assets-link "$audioJSON"
  after_script:
    - echo "Finished creating release."
