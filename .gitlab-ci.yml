cache:
    key: $CI_COMMIT_REF_SLUG
    untracked: true
    paths:
        - devTools/apkbuilder/node_modules/
        - devTools/apkbuilder/androidsdk/
        - devTools/apkbuilder/plugins/
    policy: pull
    
stages:
    - setup
    - build
    - deploy

variables:
    GIT_STRATEGY: fetch

